schema_version: 1
name: phase1_smoke
seed: 42
deterministic: true
device: cpu
results_root: results
save_each_round: false
dataset:
  name: synthetic
  synthetic_train_size: 120
  synthetic_test_size: 48
  synthetic_num_classes: 3
federated:
  algorithm: fedavg
  num_clients: 4
  clients_per_round: 2
  global_rounds: 2
  local_epochs: 1
  batch_size: 16
  learning_rate: 0.02
  non_iid_alpha: 0.5
  min_client_samples: 1
model:
  name: simple_cnn
  width: 8
