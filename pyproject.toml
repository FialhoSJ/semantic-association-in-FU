[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safu-research"
version = "0.1.0"
description = "Reproducible federated learning baseline for semantic association unlearning research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
safu-train = "safu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
